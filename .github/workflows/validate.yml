name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Agent Skills reference validator (https://agentskills.io/specification).
      # pi drops a SKILL.md whose frontmatter is missing or has no description, so a
      # skill can go silently unusable; gate on the spec instead of noticing later.
      - name: Validate skills
        run: |
          for dir in skills/*/; do
            npx -y skills-ref@0.1.5 validate "$dir"
          done
